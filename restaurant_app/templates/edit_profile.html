{% extends "base.html" %}
{% load static %}

{% block content %}
    <section class="auth-container scroll-animate-scale">
        <div class="auth-form-wrapper">
            <h1>Modifică datele de utilizator</h1>

            <form method="post" class="auth-form">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <span class="error-text">
                                {% for error in field.errors %}
                                    {{ error }}
                                {% endfor %}
                            </span>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn-submit">Salvează modificările</button>
                
                <p><a href="{% url 'profile' %}">Anulează și înapoi la profil</a></p>
            </form>
        </div>
    </section>
{% endblock %}
